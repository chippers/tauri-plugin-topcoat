[package]
name = "example-session"
description = "topcoat's sessions in a Tauri window, with the token held out of the webview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[build-dependencies]
tauri-build.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
tauri.workspace = true
tauri-plugin-topcoat = { workspace = true, features = ["session", "tracing"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# No `serve`, so nothing binds a port, and no `cookie` - which is the point.
topcoat = { workspace = true, features = ["discover", "router", "session", "view"] }

[dev-dependencies]
example-harness.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[package]
name = "custom-protocol-http"
description = "HTTP semantics for a webview custom protocol: one canonical origin, and what the transport cannot carry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
default = ["tower"]
tower = ["dep:tower-layer", "dep:tower-service"]

[dependencies]
http.workspace = true
mime.workspace = true
tower-layer = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }

[dev-dependencies]
bytes.workspace = true
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unused_qualifications = "warn"

[lints.clippy]
unwrap_used = "deny"
await_holding_lock = "deny"
indexing_slicing = "deny"
panic = "deny"

# we have a stricter set than the workspace, but mirror the rustdoc lint
[lints.rustdoc]
all = { level = "deny", priority = -1 }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

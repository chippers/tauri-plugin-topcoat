[package]
name = "tauri-plugin-topcoat"
description = "Serve a topcoat application to a Tauri webview over a custom protocol, with no port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
session = ["topcoat/session"]
# Turns on the transport's events too: half a request's story is worse than
# none, because the missing half is the part that refused it.
tracing = ["dep:tracing", "custom-protocol-http/tracing"]

[dependencies]
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
tower = { workspace = true, features = ["util"] }
tauri.workspace = true
thiserror.workspace = true
topcoat = { workspace = true, features = ["router"] }
custom-protocol-http = { workspace = true, features = ["tower"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

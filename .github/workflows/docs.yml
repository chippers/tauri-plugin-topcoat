# Actions MUST be pinned to commit SHAs. Update the useful version tag next to it.

name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let each deploy finish; the last completed deploy wins.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # macOS and Windows ship one, Linux is currently webkit2gtk
      - name: Install the Linux WebView
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      # Docs use unstable rustdoc flags; the workspace default stays stable.
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal --no-self-update

      - name: Document
        run: cargo xtask docs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Only this job gets them, and it never sees the checkout.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

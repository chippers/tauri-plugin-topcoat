[workspace]
resolver = "3"
members = ["probe", "xtask"]


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chippers/tauri-plugin-topcoat"
authors = ["Chip Reed"]

# the floor every crate here is held to
rust-version = "1.95"


[workspace.dependencies]
flate2 = "1"
serde = "1"
serde_json = "1"
url = "2"

# hyper
http = "1"

# tauri + specta (keep in lockstep during rc)
tauri = "2.11"
tauri-build = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }


[workspace.lints.rust]
unsafe_code = "forbid"

# useful for proof-of-concepts
missing_debug_implementations = "warn"
unused_qualifications = "warn"


[workspace.lints.clippy]
unwrap_used = "deny"
await_holding_lock = "deny"


# documentation is output, keep them high quality
[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }


# client Applications
[profile.release]
opt-level = "z"
incremental = false
codegen-units = 1
lto = true
panic = "abort"
strip = true


# fast, separate xtask profile
[profile.xtask]
inherits = "dev"
debug = false
debug-assertions = false
overflow-checks = false
panic = "abort"

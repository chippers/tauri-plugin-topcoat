[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "probe", "xtask"]


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chippers/tauri-plugin-topcoat"
authors = ["Chip Reed"]

# topcoat's own floor; nothing here needs anything newer.
rust-version = "1.95"


[workspace.dependencies]
flate2 = "1"
serde = "1"
serde_json = "1"
thiserror = "2"
url = "2"

# hyper
http = "1"
http-body-util = "0.1"
mime = "0.3"

# tauri + specta (keep in lockstep during rc)
tauri = "2.11"
tauri-build = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# tokio
bytes = "1"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tokio = { version = "1" }
topcoat = { version = "0.5", default-features = false }
tower = "0.5"
tower-http = "0.7"
tower-layer = "0.3"
tower-service = "0.3"


# workspace
tauri-plugin-topcoat = { path = "crates/tauri-plugin-topcoat" }
example-harness = { path = "crates/example-harness" }
custom-protocol-http = { path = "crates/custom-protocol-http" }


[workspace.lints.rust]
unsafe_code = "forbid"

# useful for proof-of-concepts
missing_debug_implementations = "warn"
unused_qualifications = "warn"


[workspace.lints.clippy]
unwrap_used = "deny"
await_holding_lock = "deny"


# documentation is output, keep them high quality
[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }


# client Applications
[profile.release]
opt-level = "z"
incremental = false
codegen-units = 1
lto = true
panic = "abort"
strip = true


# fast, separate xtask profile
[profile.xtask]
inherits = "dev"
debug = false
debug-assertions = false
overflow-checks = false
panic = "abort"
